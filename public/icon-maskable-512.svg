  <!-- Content within 80% safe zone (center 410px, inset 51px each side) -->
  <!-- Trophy crown — scaled to safe zone -->
  <g transform="translate(256, 160)">
    <path d="M-20 -34 L-25 -6 Q-25 4 -13 7 L-7 8 L-7 15 L-13 17 L-13 20 L13 20 L13 17 L7 15 L7 8 L13 7 Q25 4 25 -6 L20 -34 Z" fill="#f59e0b"/>
    <path d="M-25 -25 Q-37 -25 -37 -13 Q-37 -1 -25 -1" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M25 -25 Q37 -25 37 -13 Q37 -1 25 -1" fill="none" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <!-- COMPET — prominent within safe zone -->
  <text x="256" y="298" text-anchor="middle" font-family="'Barlow Condensed','Arial Narrow',Impact,sans-serif" font-weight="700" font-size="100" fill="#ffffff" letter-spacing="6">COMPET</text>
  <!-- Gold rule -->
  <rect x="166" y="312" width="180" height="2" rx="1" fill="#f59e0b" opacity="0.35"/>
  <!-- 2026 -->
